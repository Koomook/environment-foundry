[project]
name = "environment-foundry-company-os"
version = "0.2.0"
description = "Evidence-first adapters and evaluation tooling for company-operation environments"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0.2,<7",
]

[tool.uv]
package = true

[project.optional-dependencies]
parquet = ["pyarrow>=19,<22"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[project.scripts]
environment-foundry-v2 = "environment_foundry_v2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/environment_foundry_v2"]
